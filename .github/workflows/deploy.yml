name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # hosted runners intermittently drop the registry connection mid-download
      # (ECONNRESET); lower socket concurrency and retry the whole install step
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          ok=0
          for i in 1 2 3; do
            echo "::group::npm ci attempt $i"
            if npm ci --no-audit --no-fund --maxsockets=4 --fetch-timeout=120000 --fetch-retries=5; then
              ok=1; echo "::endgroup::"; break
            fi
            echo "::endgroup::"
            echo "attempt $i failed, cleaning and retrying"
            rm -rf node_modules
            sleep 20
          done
          test "$ok" = 1
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
